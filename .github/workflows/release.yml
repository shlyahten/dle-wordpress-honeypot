name: Release & Update GitHub Pages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.1 or v1.0.1)'
        required: false
        type: string
      dry_run:
        description: 'Dry run (build and test without publishing)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gd, zip, json, simplexml

      - name: Determine Version
        id: version_step
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            RAW_VER="${{ inputs.version }}"
          elif [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_VER="${{ github.ref_name }}"
          else
            RAW_VER=$(php -r '$xml = simplexml_load_file("honeypot-dle-plugin.xml"); echo (string)$xml->version;')
          fi
          VERSION="${RAW_VER#v}"
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Target version: ${VERSION} (Tag: ${TAG})"

      - name: Run Test Suite
        run: |
          php tests/test_honeypot.php

      - name: Build Package & Sync Versions
        run: |
          php scripts/build.php "${{ steps.version_step.outputs.version }}"

      - name: Commit & Push Version Bump to main
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if version files changed
          git add version.json honeypot-dle-plugin.xml
          if ! git diff --staged --quiet; then
            echo "Changes detected in version files. Committing to main..."
            # Save dist artifacts
            mkdir -p /tmp/dist_backup
            cp -r dist/* /tmp/dist_backup/
            
            git stash --include-untracked
            git checkout main
            git stash pop || true
            
            # Restore dist
            mkdir -p dist
            cp -r /tmp/dist_backup/* dist/
            
            git add version.json honeypot-dle-plugin.xml
            git commit -m "chore(release): bump version to ${{ steps.version_step.outputs.version }} [skip ci]"
            git push origin main
          else
            echo "Version files already up to date."
          fi
          
          # If triggered via workflow_dispatch, create and push tag if needed
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if ! git rev-parse "${{ steps.version_step.outputs.tag }}" >/dev/null 2>&1; then
              git tag -a "${{ steps.version_step.outputs.tag }}" -m "Release ${{ steps.version_step.outputs.tag }}"
              git push origin "${{ steps.version_step.outputs.tag }}"
            fi
          fi

      - name: Publish GitHub Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_step.outputs.tag }}
          name: Release ${{ steps.version_step.outputs.tag }}
          files: |
            dist/dle-wordpress-honeypot.zip
            dist/honeypot-dle-plugin.xml
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
